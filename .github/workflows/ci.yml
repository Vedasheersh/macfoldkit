name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pyyaml gemmi numpy build twine
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/mosaic_af2 -p test_evaluate_binder.py -v
      - run: python -m build
      - run: python -m twine check dist/*
      - run: macfoldkit doctor
