[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "macfoldkit"
version = "0.1.0a1"
description = "Protein folding and design, optimized for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Veda Sheersh Boorla"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
macfoldkit = "macfoldkit.cli:main"

[project.urls]
Homepage = "https://github.com/Vedasheersh/macfoldkit"
Issues = "https://github.com/Vedasheersh/macfoldkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/macfoldkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "patches", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml"]
